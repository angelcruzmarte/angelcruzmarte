<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="VOXYFI">
  <defs>
    <filter id="voxyfiGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#000000"/>
  <!-- Glowing emerald ring -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="#13d18e" stroke-width="26" opacity="0.7" filter="url(#voxyfiGlow)"/>
  <circle cx="256" cy="256" r="230" fill="none" stroke="#13d18e" stroke-width="26"/>
  <!-- Two downward chevrons: emerald over white -->
